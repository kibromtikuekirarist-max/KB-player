<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KB Player Pro</title>
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #121212; color: #ffffff; padding-bottom: 70px; }
        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }
        #bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; background: #1f1f1f; border-top: 1px solid #333; }
        #bottom-nav button { flex: 1; padding: 12px; color: #aaa; background: none; border: none; font-size: 11px; }
        #bottom-nav button.active-btn { color: #03dac6; font-weight: bold; }
    </style>
</head>
<body>
    <div id="app-container">
        <section id="player-tab" class="tab-content active">
            <h2>ማጫወቻ (Player)</h2>
            <div style="background:#1a1a1a; padding:10px; color:#03dac6;">BPM: 120 | Key: Am</div>
        </section>
    </div>
    <nav id="bottom-nav">
        <button onclick="showTab('player-tab', this)" class="active-btn">ፕሌየር</button>
    </nav>
    <script>
        function showTab(id, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('#bottom-nav button').forEach(b => b.classList.remove('active-btn'));
            btn.classList.add('active-btn');
        }
    </script>
</body>
</html>

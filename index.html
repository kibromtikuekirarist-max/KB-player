<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KB Player Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#03dac6">
    <style>
        body { font-family: sans-serif; margin: 0; background: #121212; color: #ffffff; padding-bottom: 70px; }
        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }
        #bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; background: #1f1f1f; border-top: 1px solid #333; z-index: 1000; }
        #bottom-nav button { flex: 1; padding: 12px 5px; color: #aaa; background: none; border: none; font-size: 11px; cursor: pointer; }
        #bottom-nav button.active-btn { color: #03dac6; font-weight: bold; }
        .card { background: #1e1e1e; padding: 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; background: #2c2c2c; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        button.action-btn { width: 100%; padding: 12px; background: #03dac6; border: none; color: black; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .analyzer-bar { background: #1a1a1a; padding: 8px; border-radius: 5px; font-family: monospace; color: #03dac6; margin-bottom: 10px; text-align: center; }
        .controls { display: flex; justify-content: space-around; align-items: center; margin: 15px 0; }
        .controls button { background: #333; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="app-container">
        <section id="player-tab" class="tab-content active">
            <h2>ማጫወቻ (Player)</h2>
            <div class="analyzer-bar">BPM: 120 | Key: Am</div>
            <div class="card" style="height: 100px; text-align: center; color: #777;">Waveform</div>
            <input type="range" style="width:100%">
            <div class="controls"><button>◀◀</button><button>⏮</button><button id="play-pause">PLAY</button><button>⏭</button><button>▶▶</button></div>
        </section>
        <section id="musician-hub" class="tab-content">
            <h2>ሳውንድ ላብ (Sound Lab)</h2>
            <div class="card">ኢኳላይዘር እና ኢፌክት መቆጣጠሪያ</div>
            <input type="number" placeholder="Auto-Crossfade Sec">
        </section>
        <section id="radio-tab" class="tab-content">
            <h2>ሬዲዮ (Radio)</h2>
            <div class="card">ኢትዮጵያ እና ኤርትራ ስቴሽኖች</div>
        </section>
        <section id="downloads-tab" class="tab-content">
            <h2>ዳውንሎድ (Downloader)</h2>
            <div class="card">
                <input type="text" id="url-input" placeholder="URL ይለጥፉ...">
                <select><option>WAV</option><option>FLAC</option><option>MP3</option></select>
                <button class="action-btn" onclick="alert('ዳውንሎድ ተጀምሯል!')">አውርድ</button>
            </div>
        </section>
        <section id="files-tab" class="tab-content">
            <h2>ፋይል ማናጀር</h2>
            <div class="card">ፋይሎች ዝርዝር...</div>
        </section>
        <section id="settings-tab" class="tab-content">
            <h2>ሴቲንግ (Settings)</h2>
            <div class="card">ቋንቋ እና ጭብጥ</div>
        </section>
    </div>
    <nav id="bottom-nav">
        <button onclick="showTab('player-tab', this)" class="active-btn">ፕሌየር</button>
        <button onclick="showTab('musician-hub', this)">ሳውንድ ላብ</button>
        <button onclick="showTab('radio-tab', this)">ሬዲዮ</button>
        <button onclick="showTab('downloads-tab', this)">ዳውንሎድ</button>
        <button onclick="showTab('files-tab', this)">ፋይሎች</button>
        <button onclick="showTab('settings-tab', this)">ሴቲንግ</button>
    </nav>
    <script>
        function showTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.querySelectorAll('#bottom-nav button').forEach(b => b.classList.remove('active-btn'));
            btn.classList.add('active-btn');
        }
    </script>
</body>
</html>

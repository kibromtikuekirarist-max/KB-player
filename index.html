<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-Audio Musician Player</title>
    <!-- እዚህ ጋር ለዲዛይኑ የሚያስፈልጉትን CSS እና JS ፋይሎች ታገናኛለህ -->
</head>
<body>

    <!-- ዋናው ኮንቴይነር -->
    <div id="app-container">

        <!-- 1. Player Tab -->
        <section id="player-tab" class="tab-content">
            <div class="analyzer-bar">BPM: <span id="bpm">--</span> | Key: <span id="key">--</span></div>
            <div class="visualizer"></div>
            <input type="range" id="seek-bar" min="0" max="100" value="0">
            <div class="controls">
                <button>◀◀</button> <button>⏮</button> <button id="play-pause">PLAY</button> <button>⏭</button> <button>▶▶</button>
            </div>
        </section>

        <!-- 2. Musician’s Hub (Sound Lab) -->
        <section id="musician-hub" class="tab-content">
            <h2>Sound Lab</h2>
            <div id="eq-controls">ኢኳላይዘር (EQ)</div>
            <div id="fx-rack">ኢፌክት (FX)</div>
            <label>Auto-Crossfade (Sec):</label>
            <input type="number" id="crossfade" value="2">
        </section>

        <!-- 3. Downloads Tab -->
        <section id="downloads-tab" class="tab-content">
            <input type="text" placeholder="ሊንክ ያስገቡ (Paste URL)">
            <select id="audio-format">
                <option>WAV (High Res)</option>
                <option>FLAC</option>
                <option>MP3 (320kbps)</option>
            </select>
            <select id="video-format">
                <option>MP4 (4K)</option>
                <option>Audio Extraction (Video to Audio)</option>
            </select>
            <button id="start-download">አውርድ (Download)</button>
        </section>

        <!-- 4. Radio Tab -->
        <section id="radio-tab" class="tab-content">
            <h2>የሬዲዮ ስቴሽን ማዕከል</h2>
            <div id="radio-list">ኢትዮጵያ እና ኤርትራ ስቴሽኖች (Auto-Detected)</div>
        </section>

        <!-- 5. Files Tab -->
        <section id="files-tab" class="tab-content">
            <h2>ፋይል ማናጀር (Directory Access)</h2>
            <div id="file-list">ፎልደሮች እና ፋይሎች ይዘረዘራሉ</div>
        </section>

        <!-- የታችኛው ታብ መሄጃ (Bottom Navigation) -->
        <nav id="bottom-nav">
            <button onclick="showTab('player')">Player</button>
            <button onclick="showTab('musician-hub')">Sound Lab</button>
            <button onclick="showTab('radio')">Radio</button>
            <button onclick="showTab('downloads')">Downloads</button>
            <button onclick="showTab('files')">Files</button>
        </nav>

        <!-- Mini-Player Sticky Bar -->
        <div id="mini-player">
            <span>አሁን የሚጫወት ሙዚቃ...</span>
            <button>Pause</button>
        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="ti">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KB Ultimate Music Player Pro</title>
    <!-- PWA Manifest for App Installation -->
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,{
      %22name%22: %22KB Ultimate Music Player%22,
      %22short_name%22: %22KB Player%22,
      %22start_url%22: %22./index.html%22,
      %22display%22: %22standalone%22,
      %22background_color%22: %22%23121212%22,
      %22theme_color%22: %22%231db954%22,
      %22icons%22: [
        {
          %22src%22: %22https://via.placeholder.512x512.png?text=KB%22,
          %22sizes%22: %22512x512%22,
          %22type%22: %22image/png%22
        }
      ]
    }">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 { font-size: 22px; color: #1db954; margin-bottom: 10px; }
        p { font-size: 14px; color: #b3b3b3; }
        input[type="file"] {
            display: none;
        }
        .btn {
            background-color: #1db954;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn:hover { background-color: #1aa34a; }
        audio {
            width: 100%;
            margin-top: 15px;
        }
        .track-info {
            margin-top: 15px;
            font-size: 15px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>KB Ultimate Music Player</h1>
        <p>Developer: ክብሮም ትኩእ (Pro Edition)</p>
        
        <hr style="border: 0.5px solid #333; margin: 20px 0;">

        <!-- Storage Access Button for Local Music Files -->
        <label for="audioFile" class="btn">📂 ከስቶሬጅ ሙዚቃ ክፈት (Open Music)</label>
        <input type="file" id="audioFile" accept="audio/*">

        <div class="track-info" id="trackName">ምንም ሙዚቃ አልተመረጠም</div>

        <!-- Audio Player Element -->
        <audio id="audioPlayer" controls></audio>
    </div>

    <script>
        const audioFile = document.getElementById('audioFile');
        const audioPlayer = document.getElementById('audioPlayer');
        const trackName = document.getElementById('trackName');

        // Handle File Selection from Internal Storage with Permission Handling
        audioFile.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                trackName.textContent = "የተመረጠው ፋይል: " + file.name;
                const fileURL = URL.createObjectURL(file);
                audioPlayer.src = fileURL;
                audioPlayer.play().catch(error => {
                    console.error("Playback error:", error);
                    alert("ሙዚቃውን ማጫወት አልተቻለም። እባክዎ ትክክለኛ የኦዲዮ ፋይል መሆኑን ይፈትሹ።");
                });
            }
        });

        // Register Service Worker for PWA / App Installation support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // Creates a virtual service worker blob to make Chrome prompt "Install App"
                const swCode = `
                    self.addEventListener('install', (e) => { self.skipWaiting(); });
                    self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
                    self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });
                `;
                const blob = new Blob([swCode], { type: 'text/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl)
                    .then(() => console.log('PWA Service Worker Registered Successfully'))
                    .catch(err => console.log('SW Registration Failed', err));
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KB Player Pro - Fixed Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: sans-serif; background-color: #000; color: #fff; text-align: center; height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        
        .app-container { background: #111; padding: 8px; border-radius: 12px; width: 100%; max-width: 420px; height: 96vh; display: flex; flex-direction: column; border: 1px solid #222; box-shadow: 0 8px 25px rgba(0,0,0,0.9); }
        
        h2 { color: #1db954; font-size: 14px; margin-bottom: 0; }
        .creator { color: #1db954; font-size: 8px; font-weight: bold; margin-bottom: 6px; }
        
        .main-tabs { display: flex; background: #181818; padding: 3px; border-radius: 6px; gap: 2px; flex-shrink: 0; margin-bottom: 6px; }
        .m-tab { flex: 1; padding: 8px 2px; background: transparent; color: #888; border: none; font-size: 8px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .m-tab.active { background: #1db954; color: #000; }
        
        .tab-content { flex: 1; overflow-y: auto; margin-bottom: 6px; padding-right: 2px; text-align: left; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        
        .card { background: #181818; padding: 8px; border-radius: 8px; margin-bottom: 6px; border: 1px solid #252525; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 9px; color: #aaa; }
        
        input, select { width: 100%; padding: 7px; background: #222; color: #fff; border: 1px solid #333; border-radius: 6px; font-size: 10px; margin-bottom: 4px; }
        
        .primary-btn { display: block; width: 100%; padding: 10px; background: #1db954; color: #000; text-align: center; border-radius: 6px; font-weight: bold; font-size: 10px; border: none; cursor: pointer; margin-bottom: 4px; }
        .primary-btn:active { background: #1ed760; }

        .control-row { display: flex; gap: 4px; margin-top: 4px; }
        .control-row button { flex: 1; padding: 8px 4px; background: #222; color: #fff; border: 1px solid #333; border-radius: 6px; font-size: 9px; font-weight: bold; cursor: pointer; }
        .control-row button:active { background: #1db954; color: #000; }
        
        .playlist-box { width: 100%; background: #111; color: #1db954; border: 1px solid #222; border-radius: 6px; padding: 4px; font-size: 9px; height: 70px; }
        
        .row-ctrl { display: flex; justify-content: space-between; align-items: center; font-size: 9px; margin-bottom: 4px; }
        .row-ctrl span { color: #aaa; width: 60px; }
        .row-ctrl input { flex: 1; margin: 0 6px; margin-bottom: 0; }
        .row-ctrl b { color: #1db954; width: 25px; text-align: right; }

        .time-container { display: flex; justify-content: space-between; font-size: 8px; color: #888; margin-top: 2px; margin-bottom: 4px; }
        .global-player-bar { background: #141414; padding: 8px; border-radius: 8px; border: 1px solid #222; flex-shrink: 0; }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>KB Player Pro</h2>
        <div class="creator">ሰሪ: ክብሮም ትኩእ (Master Revs)</div>

        <div class="main-tabs">
            <button class="m-tab active" onclick="sT(0)">ፕሌየር</button>
            <button class="m-tab" onclick="sT(1)">ሙዚቀኛ</button>
            <button class="m-tab" onclick="sT(2)">ስቱዲዮ</button>
            <button class="m-tab" onclick="sT(3)">ኢፌክት</button>
            <button class="m-tab" onclick="sT(4)">ሬዲዮ</button>
        </div>

        <div class="tab-content">
            <!-- TAB 0: ፕሌየር እና ፋይል መምረጫ -->
            <div id="p0" class="tab-panel active">
                <div class="card">
                    <label>📁 ከስልክዎ ሙዚቃዎችን ይምረጡ:</label>
                    <input type="file" id="mediaInput" accept="audio/*,video/*,.mp3,.wav,.m4a,.aac" multiple onchange="loadFiles(this)">
                    <select id="playlist" class="playlist-box" size="3" onchange="playIndex(this.value)"></select>
                </div>
                <div class="card">
                    <label>የድምፅ ፍጥነት መቆጣጠሪያ:</label>
                    <div class="control-row">
                        <button onclick="setSpeed(0.75)">0.75x</button>
                        <button onclick="setSpeed(1.0)" style="color:#1db954;">1.0x መደበኛ</button>
                        <button onclick="setSpeed(1.25)">1.25x</button>
                        <button onclick="setSpeed(1.5)">1.5x</button>
                    </div>
                </div>
            </div>

            <!-- TAB 1: ሙዚቀኛ -->
            <div id="p1" class="tab-panel">
                <div class="card">
                    <label>🎧 የድምፅ ክፍሎች ማስተካከያ (Stems):</label>
                    <div class="row-ctrl"><span>ድምፃዊ</span><input type="range" min="0" max="100" value="100" oninput="upStem('v vocal', this.value)"><b id="vocalVal">100%</b></div>
                    <div class="row-ctrl"><span>ቤዝ</span><input type="range" min="0" max="100" value="100" oninput="upStem('bass', this.value)"><b id="bassVal">100%</b></div>
                    <div class="row-ctrl"><span>ከበሮ</span><input type="range" min="0" max="100" value="100" oninput="upStem('drum', this.value)"><b id="drumVal">100%</b></div>
                </div>
            </div>

            <!-- TAB 2: ስቱዲዮ -->
            <div id="p2" class="tab-panel">
                <div class="card">
                    <label>🔴 የድምፅ ቅጂ (Voice Recording):</label>
                    <div class="control-row">
                        <button class="primary-btn" style="background:#ff4444; color:#fff; margin-bottom:0;" onclick="alert('ቅጂ ተጀምሯል')">⏺ ጀምር</button>
                        <button class="primary-btn" style="background:#333; color:#fff; margin-bottom:0;" onclick="alert('ቅጂ ቆሟል')">⏹ አቁም</button>
                    </div>
                </div>
            </div>

            <!-- TAB 3: ኢፌክት -->
            <div id="p3" class="tab-panel">
                <div class="card">
                    <label>🌐 3D ቨርቹዋል ስፓሻል ድምፅ:</label>
                    <select onchange="alert('ተስተካክሏል: ' + this.value)">
                        <option value="off">ጠፍቷል (OFF)</option>
                        <option value="wide">ሰፊ ስቴጅ (Wide Surround)</option>
                        <option value="concert">ኮንሰርት አዳራሽ (Concert Arena)</option>
                    </select>
                </div>
            </div>

            <!-- TAB 4: ሬዲዮ -->
            <div id="p4" class="tab-panel">
                <div class="card">
                    <label>የቀጥታ ሬዲዮ ዥረት (Live Radio):</label>
                    <select id="radioSel" onchange="playRadio(this.value)">
                        <option value="">-- ጣቢያ ይምረጡ --</option>
                        <option value="https://stream.zeno.fm/fana_fm_live">ፋና ኤፍኤም 98.1</option>
                        <option value="https://stream.zeno.fm/sheger_fm_102.1">ሸገር ኤፍኤም 102.1</option>
                    </select>
                    <audio id="radioPlayer" controls style="width:100%; margin-top:6px;"></audio>
                </div>
            </div>
        </div>

        <!-- STICKY PLAYER BAR -->
        <div class="global-player-bar">
            <audio id="mediaPlayer" onended="skipMedia(1)"></audio>
            
            <div style="margin-bottom: 4px;">
                <input type="range" id="progressBar" value="0" min="0" max="100" step="0.1" style="width:100%;" oninput="seekAudio(this.value)">
                <div class="time-container">
                    <span id="currentTime">00:00</span>
                    <span id="totalDuration">00:00</span>
                </div>
            </div>

            <div class="control-row">
                <button onclick="skipMedia(-1)">⏮ ፕሪቪየስ</button>
                <button onclick="togglePlay()" style="background:#1db954; color:#000;">⏯ ፕሌይ / ፖዝ</button>
                <button onclick="skipMedia(1)">ኔክስት ⏭</button>
            </div>
        </div>
    </div>

    <script>
        let pFiles = [], cIdx = 0;
        const player = document.getElementById('mediaPlayer');
        const pBar = document.getElementById('progressBar');
        const cTime = document.getElementById('currentTime');
        const tDur = document.getElementById('totalDuration');

        function sT(i) {
            document.querySelectorAll('.m-tab').forEach((t, j) => t.classList.toggle('active', i === j));
            document.querySelectorAll('.tab-panel').forEach((p, j) => p.classList.toggle('active', i === j));
        }

        function loadFiles(input) {
            pFiles = Array.from(input.files);
            const pl = document.getElementById('playlist');
            pl.innerHTML = "";
            pFiles.forEach((f, idx) => {
                let opt = document.createElement('option');
                opt.value = idx;
                opt.text = (idx + 1) + ". " + f.name;
                pl.appendChild(opt);
            });
            if(pFiles.length > 0) playIndex(0);
        }

        function playIndex(idx) {
            cIdx = parseInt(idx);
            document.getElementById('playlist').selectedIndex = cIdx;
            player.src = URL.createObjectURL(pFiles[cIdx]);
            player.play().catch(e => console.log(e));
        }

        function togglePlay() {
            if(player.paused) player.play();
            else player.pause();
        }

        function skipMedia(dir) {
            if(pFiles.length === 0) return;
            cIdx = (cIdx + dir + pFiles.length) % pFiles.length;
            playIndex(cIdx);
        }

        function setSpeed(r) { player.playbackRate = r; }

        player.addEventListener('timeupdate', () => {
            if(!isNaN(player.duration)) {
                pBar.value = (player.currentTime / player.duration) * 100;
                cTime.innerText = fmt(player.currentTime);
                tDur.innerText = fmt(player.duration);
            }
        });

        function seekAudio(v) {
            if(!isNaN(player.duration)) player.currentTime = (v / 100) * player.duration;
        }

        function fmt(s) {
            let m = Math.floor(s / 60), sec = Math.floor(s % 60);
            return (m < 10 ? "0" + m : m) + ":" + (sec < 10 ? "0" + sec : sec);
        }

        function upStem(t, v) { 
            let el = document.getElementById(t.trim() + 'Val');
            if(el) el.innerText = v + '%'; 
        }

        function playRadio(u) { 
            if(u) { 
                let rp = document.getElementById('radioPlayer'); 
                rp.src = u; 
                rp.play(); 
            } 
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    <title>KB Player Pro - Master Revs Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 4px; background-color: #000; color: #fff; text-align: center; height: 100vh; overflow: hidden; }
        
        .app-container { background: #0c0c0c; padding: 6px; border-radius: 10px; display: inline-block; width: 100%; max-width: 440px; text-align: left; border: 1px solid #1a1a1a; box-shadow: 0 4px 15px rgba(0,0,0,0.8); height: 98vh; display: flex; flex-direction: column; }
        
        h2 { text-align: center; color: #1db954; font-size: 13px; margin-bottom: 0; }
        .creator { text-align: center; color: #1db954; font-size: 7.5px; font-weight: bold; margin-bottom: 3px; }
        
        .main-tabs { display: flex; margin-bottom: 4px; background: #141414; padding: 2px; border-radius: 5px; gap: 2px; flex-shrink: 0; }
        .m-tab { flex: 1; padding: 6px 1px; background: transparent; color: #777; border: none; font-size: 7px; font-weight: 700; cursor: pointer; border-radius: 4px; white-space: nowrap; }
        .m-tab.active { background: #1db954; color: #000; }
        
        .tab-content { flex: 1; overflow-y: auto; margin-bottom: 4px; padding-right: 2px; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        
        .card { background: #121212; padding: 6px; border-radius: 6px; margin-bottom: 4px; border: 1px solid #1a1a1a; }
        label { display: block; margin-bottom: 2px; font-weight: 600; font-size: 7.5px; color: #888; }
        
        input, select { width: 100%; padding: 5px; background: #181818; color: #fff; border: 1px solid #222; border-radius: 4px; font-size: 8.5px; margin-bottom: 3px; }
        input[type="range"] { accent-color: #1db954; height: 3px; cursor: pointer; }
        
        /* Big Universal Storage Access Button */
        .file-upload-wrapper { position: relative; overflow: hidden; display: block; width: 100%; margin-bottom: 3px; }
        .file-upload-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
        .big-file-btn { display: block; width: 100%; padding: 10px; background: linear-gradient(135deg, #1db954, #1ed760); color: #000; text-align: center; border-radius: 6px; font-weight: 800; font-size: 9px; cursor: pointer; border: none; box-shadow: 0 3px 10px rgba(29,185,84,0.3); }

        .control-row { display: flex; gap: 3px; margin-top: 3px; }
        .control-row button { flex: 1; padding: 5px; background: #1a1a1a; color: #fff; border: 1px solid #282828; border-radius: 4px; font-size: 7.5px; font-weight: 600; cursor: pointer; }
        .control-row button:active { background: #1db954; color: #000; }
        
        .file-list { max-height: 55px; overflow-y: auto; background: #080808; padding: 3px; border-radius: 4px; font-size: 7.5px; border: 1px solid #161616; }
        .file-item { padding: 2px; border-bottom: 1px solid #111; cursor: pointer; color: #1db954; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .row-ctrl { display: flex; justify-content: space-between; align-items: center; font-size: 7.5px; margin-bottom: 2px; }
        .row-ctrl span { color: #aaa; width: 60px; }
        .row-ctrl input { flex: 1; margin: 0 4px; margin-bottom: 0; }
        .row-ctrl b { color: #1db954; width: 22px; text-align: right; font-size: 7.5px; }

        .time-container { display: flex; justify-content: space-between; font-size: 7px; color: #777; margin-top: 1px; margin-bottom: 2px; }
        
        .global-player-bar { background: #101010; padding: 5px; border-radius: 6px; border: 1px solid #1f1f1f; flex-shrink: 0; }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>KB Player Pro</h2>
        <div class="creator">ሰሪ: ክብሮም ትኩእ (Master Revs)</div>

        <div class="main-tabs" id="tabNav">
            <button class="m-tab active" onclick="sT(0)">ፕሌየር</button>
            <button class="m-tab" onclick="sT(1)">ፋይል</button>
            <button class="m-tab" onclick="sT(2)">ሙዚቀኛ</button>
            <button class="m-tab" onclick="sT(3)">ስቱዲዮ</button>
            <button class="m-tab" onclick="sT(4)">ኢፌክት</button>
            <button class="m-tab" onclick="sT(5)">ሬዲዮ</button>
            <button class="m-tab" onclick="sT(6)">ሴቲንግ</button>
        </div>

        <div class="tab-content">
            <!-- TAB 0: ፕሌየር -->
            <div id="p0" class="tab-panel active">
                <div class="card">
                    <label>ከስልክዎ/ኮምፒውተርዎ ሙዚቃዎችን ይምረጡ:</label>
                    <div class="file-upload-wrapper">
                        <button class="big-file-btn">📁 ከማንኛውም ማህደር ፋይሎችን ምረጥ</button>
                        <!-- accept="*" and multiple allows total storage access for any audio/video format -->
                        <input type="file" id="mediaInput" accept="audio/*,video/*,.mp3,.wav,.m4a,.aac,.ogg,.flac,.mp4,.mkv" multiple onchange="loadFiles(this)">
                    </div>
                    <select id="playlist" size="3" onchange="playIndex(this.value)" style="margin-top:2px;"></select>
                </div>
                <div class="card">
                    <label>የድምፅ ፍጥነት መቆጣጠሪያ:</label>
                    <div class="control-row">
                        <button onclick="setSpeed(0.75)">0.75x</button>
                        <button onclick="setSpeed(1.0)" style="color:#1db954;">1.0x መደበኛ</button>
                        <button onclick="setSpeed(1.25)">1.25x</button>
                        <button onclick="setSpeed(1.5)">1.5x</button>
                    </div>
                </div>
            </div>

            <!-- TAB 1: ፋይል / ዳይሬክተሪ -->
            <div id="p1" class="tab-panel">
                <div class="card">
                    <label>የውስጥ ማጠራቀሚያ ዳይሬክተሪ:</label>
                    <button class="primary-btn" onclick="openFolder()" style="background:#1db954; color:#000; font-weight:bold;">📂 ፎልደር ክፈት</button>
                    <div id="folderName" style="font-size: 7px; color: #666; margin-top: 2px;">ምንም ፎልደር አልተመረጠም።</div>
                </div>
                <div class="card">
                    <label>የፎልደሩ ፋይሎች:</label>
                    <div class="file-list" id="folderFiles">
                        <div style="color: #444; text-align: center; padding: 4px;">ፎልደር ይክፈቱ</div>
                    </div>
                </div>
            </div>

            <!-- TAB 2: ሙዚቀኛ -->
            <div id="p2" class="tab-panel">
                <div class="card">
                    <label>🎧 የድምፅ ክፍሎች ማስተካከያ (Stems):</label>
                    <div class="row-ctrl"><span>ድምፃዊ</span><input type="range" min="0" max="100" value="100" id="vocalVol" oninput="upStem('vocal', this.value)"><b id="vocalVal">100%</b></div>
                    <div class="row-ctrl"><span>ቤዝ</span><input type="range" min="0" max="100" value="100" id="bassVol" oninput="upStem('bass', this.value)"><b id="bassVal">100%</b></div>
                    <div class="row-ctrl"><span>ከበሮ</span><input type="range" min="0" max="100" value="100" id="drumVol" oninput="upStem('drum', this.value)"><b id="drumVal">100%</b></div>
                    <div class="row-ctrl"><span>ጊታር</span><input type="range" min="0" max="100" value="100" id="guitarVol" oninput="upStem('guitar', this.value)"><b id="guitarVal">100%</b></div>
                </div>
            </div>

            <!-- TAB 3: ስቱዲዮ -->
            <div id="p3" class="tab-panel">
                <div class="card">
                    <label>🔴 የድምፅ ቅጂ ስቱዲዮ (Voice & Krar):</label>
                    <div class="control-row">
                        <button class="primary-btn" style="background:#ff4444; color:#fff;" onclick="recStatus('start')">⏺ ጀምር</button>
                        <button class="primary-btn" style="background:#333; color:#fff;" onclick="recStatus('stop')">⏹ አቁም</button>
                    </div>
                    <div id="rStat" style="font-size: 7px; color: #1db954; margin-top: 2px; text-align: center;">ዝግጁ ነው።</div>
                </div>
                <div class="card">
                    <label>🎚️ ማስተር ኢኳላይዘር (Pro EQ):</label>
                    <div class="row-ctrl"><span>60Hz</span><input type="range" min="-12" max="12" value="0" oninput="eqChange(this.value)"><b>0dB</b></div>
                    <div class="row-ctrl"><span>1kHz</span><input type="range" min="-12" max="12" value="0" oninput="eqChange(this.value)"><b>0dB</b></div>
                    <div class="row-ctrl"><span>16kHz</span><input type="range" min="-12" max="12" value="0" oninput="eqChange(this.value)"><b>0dB</b></div>
                </div>
            </div>

            <!-- TAB 4: ኢፌክት -->
            <div id="p4" class="tab-panel">
                <div class="card">
                    <label>🌐 3D ቨርቹዋል ስፓሻል ድምፅ:</label>
                    <select onchange="fxAlert('3D Spatial', this.value)">
                        <option value="off">ጠፍቷል (OFF)</option>
                        <option value="wide">ሰፊ ስቴጅ (Wide Surround)</option>
                        <option value="concert">ኮንሰርት አዳራሽ (Concert Arena)</option>
                    </select>
                </div>
                <div class="card">
                    <label>🏛️ ፕሮፌሽናል ሪቨርብ:</label>
                    <select onchange="fxAlert('Reverb', this.value)">
                        <option value="off">ደረቅ ድምፅ (Normal)</option>
                        <option value="studio">ስቱዲዮ ቫይብ</option>
                        <option value="hall">ትልቅ አዳራሽ</option>
                    </select>
                </div>
            </div>

            <!-- TAB 5: ሬዲዮ -->
            <div id="p5" class="tab-panel">
                <div class="card">
                    <label>KB Global Radio Hub:</label>
                    <select id="radioSel" onchange="playRadio(this.value)">
                        <option value="">-- ጣቢያ ይምረጡ --</option>
                        <option value="https://stream.zeno.fm/fana_fm_live">ፋና ኤፍኤም 98.1</option>
                        <option value="https://stream.zeno.fm/sheger_fm_102.1">ሸገር ኤፍኤም 102.1</option>
                        <option value="https://stream.zeno.fm/dimtsi_hafash">ድምፂ ሃፋሽ</option>
                    </select>
                    <audio id="radioPlayer" controls style="width:100%; margin-top:3px;"></audio>
                </div>
            </div>

            <!-- TAB 6: ሴቲንግ -->
            <div id="p6" class="tab-panel">
                <div class="card">
                    <label>የቋንቋ ምርጫ (Language):</label>
                    <select>
                        <option>አማርኛ (Amharic)</option>
                        <option>ትግርኛ (Tigrinya)</option>
                        <option>Afaan Oromoo</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 🌟 GLOBAL STICKY BOTTOM PLAYER BAR -->
        <div class="global-player-bar">
            <!-- Fixed Audio Element to Ensure Stable Sound Playback -->
            <audio id="mediaPlayer" style="display:none;" onended="skipMedia(1)"></audio>
            
            <div style="margin-bottom: 2px;">
                <input type="range" id="progressBar" value="0" min="0" max="100" step="0.1" style="width:100%;" oninput="seekAudio(this.value)">
                <div class="time-container">
                    <span id="currentTime">00:00</span>
                    <span id="totalDuration">00:00</span>
                </div>
            </div>

            <div style="display: flex; align-items: center; gap: 3px; margin-bottom: 2px; font-size: 7.5px;">
                <span style="color:#888; width:28px;">ቮልዩም:</span>
                <input type="range" min="0" max="1" step="0.05" value="1" style="flex:1; margin-bottom:0;" oninput="player.volume = this.value">
            </div>

            <div class="control-row" style="margin-top:0;">
                <button onclick="skipMedia(-1)">⏮ ፕሪቪየስ</button>
                <button onclick="skipTime(-10)">⏪ -10ሰ</button>
                <button onclick="togglePlay()" style="background:#1db954; color:#000;">⏯ ፕሌይ/ፖዝ</button>
                <button onclick="skipTime(10)">+10ሰ ⏩</button>
                <button onclick="skipMedia(1)">ኔክስት ⏭</button>
            </div>
        </div>
    </div>

    <script>
        let pFiles = [], cIdx = 0;
        const player = document.getElementById('mediaPlayer');
        const pBar = document.getElementById('progressBar');
        const cTime = document.getElementById('currentTime');
        const tDur = document.getElementById('totalDuration');

        function sT(i) {
            document.querySelectorAll('.m-tab').forEach((t, j) => t.classList.toggle('active', i === j));
            document.querySelectorAll('.tab-panel').forEach((p, j) => p.classList.toggle('active', i === j));
        }

        function loadFiles(input) {
            pFiles = Array.from(input.files);
            const pl = document.getElementById('playlist');
            pl.innerHTML = "";
            pFiles.forEach((f, idx) => {
                let opt = document.createElement('option');
                opt.value = idx;
                opt.text = (idx + 1) + ". " + f.name;
                pl.appendChild(opt);
            });
            if(pFiles.length > 0) playIndex(0);
        }

        function playIndex(idx) {
            cIdx = parseInt(idx);
            document.getElementById('playlist').selectedIndex = cIdx;
            
            // Fix storage playback binding
            const fileURL = URL.createObjectURL(pFiles[cIdx]);
            player.src = fileURL;
            player.load();
            player.play().catch(err => {
                console.log("Playback error: ", err);
            });
        }

        function togglePlay() {
            if(player.paused) {
                player.play();
            } else {
                player.pause();
            }
        }

        function skipMedia(dir) {
            if(pFiles.length === 0) return;
            cIdx = (cIdx + dir + pFiles.length) % pFiles.length;
            playIndex(cIdx);
        }

        function skipTime(sec) { player.currentTime += sec; }
        function setSpeed(r) { player.playbackRate = r; }

        player.addEventListener('timeupdate', () => {
            if(!isNaN(player.duration)) {
                pBar.value = (player.currentTime / player.duration) * 100;
                cTime.innerText = fmt(player.currentTime);
                tDur.innerText = fmt(player.duration);
            }
        });

        function seekAudio(v) {
            if(!isNaN(player.duration)) player.currentTime = (v / 100) * player.duration;
        }

        function fmt(s) {
            let m = Math.floor(s / 60), sec = Math.floor(s % 60);
            return (m < 10 ? "0" + m : m) + ":" + (sec < 10 ? "0" + sec : sec);
        }

        async function openFolder() {
            try {
                const dir = await window.showDirectoryPicker();
                document.getElementById('folderName').innerText = "ፎልደር: " + dir.name;
                const fc = document.getElementById('folderFiles');
                fc.innerHTML = "";
                for await (const entry of dir.values()) {
                    if(entry.kind === 'file') {
                        let div = document.createElement('div');
                        div.className = "file-item";
                        div.innerText = "📄 " + entry.name;
                        fc.appendChild(div);
                    }
                }
            } catch(e) {
                console.log("Folder picker cancelled or unsupported");
            }
        }

        function upStem(t, v) { document.getElementById(t + 'Val').innerText = v + '%'; }
        function recStatus(s) { document.getElementById('rStat').innerText = (s === 'start') ? "🔴 በመቀረጽ ላይ..." : "✅ ተቀምጧል!"; }
        function eqChange(v) {}
        function fxAlert(t, v) {}
        function playRadio(u) { if(u) { let rp = document.getElementById('radioPlayer'); rp.src = u; rp.play(); } }

        // PWA Service Worker for Offline Installs and Smooth Loading
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    self.addEventListener('install', (e) => { self.skipWaiting(); });
                    self.addEventListener('activate', (e) => { e.waitUntil(clients.claim()); });
                    self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });
                `;
                const blob = new Blob([swCode], { type: 'text/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(err => console.log('SW error', err));
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KB Player Pro</title>
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <h1>KB Player Pro</h1>
    <button id="install-btn" style="display:none; padding:10px; background:green; color:white;">Install App</button>
    <div id="player-content">ሙዚቃ ማጫወቻው ክፍል እዚህ አለ</div>
    
    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            const btn = document.getElementById('install-btn');
            btn.style.display = 'block';
            btn.addEventListener('click', () => e.prompt());
        });
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KB Player Pro - Working Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: #000; color: #fff; padding: 6px; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .app-container { background: #111; padding: 10px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #222; box-shadow: 0 8px 20px rgba(0,0,0,0.9); display: flex; flex-direction: column; gap: 8px; }
        h2 { text-align: center; color: #1db954; font-size: 14px; }
        .creator { text-align: center; color: #888; font-size: 8px; margin-bottom: 4px; }
        .card { background: #181818; padding: 8px; border-radius: 8px; border: 1px solid #282828; }
        label { display: block; font-size: 9px; color: #aaa; margin-bottom: 4px; }
        input[type="file"] { width: 100%; background: #222; color: #fff; padding: 6px; font-size: 9px; border: 1px solid #333; border-radius: 4px; }
        select { width: 100%; background: #222; color: #fff; padding: 6px; font-size: 9px; border: 1px solid #333; border-radius: 4px; margin-top: 4px; }
        .player-controls { display: flex; gap: 4px; margin-top: 6px; }
        button { flex: 1; padding: 8px; background: #1db954; color: #000; border: none; border-radius: 4px; font-weight: bold; font-size: 9px; cursor: pointer; }
        button:active { background: #1aa34a; }
        .secondary-btn { background: #333; color: #fff; }
        .progress-box { margin-top: 6px; }
        input[type="range"] { width: 100%; accent-color: #1db954; }
        .time-info { display: flex; justify-content: space-between; font-size: 8px; color: #888; margin-top: 2px; }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>KB Player Pro</h2>
        <div class="creator">ሰሪ: ክብሮም ትኩእ</div>

        <div class="card">
            <label>🎵 የሙዚቃ ፋይሎችን ይምረጡ (በርካታ መምረጥ ይቻላል):</label>
            <input type="file" id="fileInput" accept="audio/*" multiple onchange="handleFiles(this)">
            <select id="playlist" size="4" onchange="playSelected(this.value)"></select>
        </div>

        <div class="card">
            <div class="progress-box">
                <input type="range" id="progressBar" value="0" min="0" max="100" step="0.1" oninput="seekAudio(this.value)">
                <div class="time-info">
                    <span id="currentTime">00:00</span>
                    <span id="duration">00:00</span>
                </div>
            </div>

            <div class="player-controls">
                <button class="secondary-btn" onclick="skip(-1)">⏮ ቐዳማይ</button>
                <button onclick="togglePlay()" id="playBtn">⏯ ፕሌይ / ፖዝ</button>
                <button class="secondary-btn" onclick="skip(1)">ቀጻሊ ⏭</button>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" onended="skip(1)"></audio>

    <script>
        let audioFiles = [];
        let currentIndex = 0;
        const player = document.getElementById('audioPlayer');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');

        function handleFiles(input) {
            if (!input.files || input.files.length === 0) return;
            audioFiles = Array.from(input.files);
            const playlistSelect = document.getElementById('playlist');
            playlistSelect.innerHTML = "";

            audioFiles.forEach((file, index) => {
                let option = document.createElement('option');
                option.value = index;
                option.text = (index + 1) + ". " + file.name;
                playlistSelect.appendChild(option);
            });

            playSelected(0);
        }

        function playSelected(index) {
            if (audioFiles.length === 0) return;
            currentIndex = parseInt(index);
            document.getElementById('playlist').selectedIndex = currentIndex;

            const fileURL = URL.createObjectURL(audioFiles[currentIndex]);
            player.src = fileURL;
            player.load();
            player.play().catch(err => console.log("Play error:", err));
        }

        function togglePlay() {
            if (audioFiles.length === 0) {
                alert("እባክዎ መጀመሪያ ሙዚቃ ይምረጡ!");
                return;
            }
            if (player.paused) {
                player.play().catch(err => console.log(err));
            } else {
                player.pause();
            }
        }

        function skip(direction) {
            if (audioFiles.length === 0) return;
            currentIndex = (currentIndex + direction + audioFiles.length) % audioFiles.length;
            playSelected(currentIndex);
        }

        player.addEventListener('timeupdate', () => {
            if (!isNaN(player.duration)) {
                let progress = (player.currentTime / player.duration) * 100;
                progressBar.value = progress;
                currentTimeEl.innerText = formatTime(player.currentTime);
                durationEl.innerText = formatTime(player.duration);
            }
        });

        function seekAudio(value) {
            if (!isNaN(player.duration)) {
                player.currentTime = (value / 100) * player.duration;
            }
        }

        function formatTime(seconds) {
            let m = Math.floor(seconds / 60);
            let s = Math.floor(seconds % 60);
            return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
        }
    </script>
</body>
</html>
